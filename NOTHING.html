<!doctype html>
<html lang="en">

<head>
    <title></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #000000;
            --bg-secondary: rgba(10, 10, 10, 0.6);
            --bg-panel: rgba(8, 8, 8, 0.72);
            --bg-tab: rgba(255, 255, 255, 0.04);
            --bg-tab-active: rgba(255, 255, 255, 0.10);
            --bg-tab-hover: rgba(255, 255, 255, 0.07);
            --accent: #ffffff;
            --accent-strong: #ffffff;
            --accent-glow: rgba(255,255,255,0.12);
            --text: #ffffff;
            --muted: #999999;
            --border: rgb(110, 110, 110);
            --border-subtle: rgba(110, 110, 110, 0.45);
            --border-accent: #ffffff;
            --glass-blur: blur(18px) saturate(1.4);
            --font-ui: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
            --font-mono: "Fira Code", "JetBrains Mono", "Consolas", monospace;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
        }

        body {
            font-family: var(--font-ui);
            background: #000;
            color: var(--text);
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            opacity: 1;
        }

        /* Smooth transitions enabled for liquid glass */

        .app {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            position: relative;
            contain: layout style;
        }

        #monaco-editor,
        .modal-input,
        #script-hub-search,
        .monaco-editor textarea {
            user-select: text !important;
            -webkit-user-select: text !important;
        }

        ::selection {
            background: rgba(255,255,255,0.25);
            color: #fff;
        }

        .resize-handle {
            position: absolute;
            z-index: 2000;
            background: transparent;
            user-select: none;
        }

        .resize-handle.top,
        .resize-handle.bottom {
            left: 10px;
            right: 10px;
            height: 6px;
        }

        .resize-handle.left,
        .resize-handle.right {
            top: 10px;
            bottom: 10px;
            width: 6px;
        }

        .resize-handle.top {
            top: 0;
            cursor: ns-resize;
        }

        .resize-handle.bottom {
            bottom: 0;
            cursor: ns-resize;
        }

        .resize-handle.left {
            left: 0;
            cursor: ew-resize;
        }

        .resize-handle.right {
            right: 0;
            cursor: ew-resize;
        }

        .resize-handle.top-left,
        .resize-handle.top-right,
        .resize-handle.bottom-left,
        .resize-handle.bottom-right {
            width: 12px;
            height: 12px;
        }

        .resize-handle.top-left {
            top: 0;
            left: 0;
            cursor: nwse-resize;
        }

        .resize-handle.top-right {
            top: 0;
            right: 0;
            cursor: nesw-resize;
        }

        .resize-handle.bottom-left {
            bottom: 0;
            left: 0;
            cursor: nesw-resize;
        }

        .resize-handle.bottom-right {
            bottom: 0;
            right: 0;
            cursor: nwse-resize;
        }

        .app.host-maximized .resize-handle {
            display: none;
        }

        .window-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            min-height: 40px;
            box-sizing: border-box;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(6, 6, 6, 0.95);
            user-select: none;
            z-index: 100;
            gap: 10px;
        }

        .window-bar-center {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            justify-content: flex-end;
        }

        .winbar-sep {
            width: 1px;
            height: 18px;
            background: rgba(110,110,110,0.4);
            flex-shrink: 0;
        }

        .winbar-btn {
            border: 1px solid rgba(110,110,110,0.45);
            background: rgba(255,255,255,0.02);
            color: #888;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            cursor: pointer;
            transition: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }

        .winbar-btn:hover {
            border-color: rgb(110,110,110);
            color: #ffffff;
            background: rgba(255,255,255,0.06);
        }

        .winbar-btn.console-toggle.console-visible {
            border-color: rgba(255,255,255,0.45);
            color: #ffffff;
            background: rgba(255,255,255,0.08);
        }

        .winbar-btn.console-toggle.console-visible:hover {
            background: rgba(255,255,255,0.13);
        }

        .winbar-btn-wide {
            width: auto;
            padding: 0 9px;
            font-family: var(--font-ui);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        /* Version box — styled like SOLARA VERSION chip */
        .version-box {
            display: inline-flex;
            align-items: center;
            height: 26px;
            padding: 0 10px;
            border: 1px solid rgba(110,110,110,0.38);
            border-radius: 6px;
            background: rgba(255,255,255,0.025);
            font-family: var(--font-ui);
            font-size: 9px;
            font-weight: 700;
            color: rgba(255,255,255,0.32);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            white-space: nowrap;
            flex-shrink: 0;
            cursor: default;
            user-select: none;
        }

        .window-title {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #ffffff;
        }

        .window-title-wrap {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .window-status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.45);
            background: #ff2f2f;
        }

        .window-status-dot.status-trying {
            background: #ffd400;
        }

        .window-status-dot.status-attached {
            background: #28c840;
        }

        .window-status-dot.status-error {
            background: #ff2f2f;
        }

        .window-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-direction: row-reverse;
        }

        .win-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.45);
            cursor: pointer;
            padding: 0;
        }

        .win-btn.close {
            background: #ff5f57;
        }

        .win-btn.max {
            background: #ffbd2e;
        }

        .win-btn.min {
            background: #28c840;
        }

        .win-btn:hover {
        }

        .app.minimized .tabs-bar,
        .app.minimized .editor-shell {
            display: none;
        }

        .tabs-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(5, 5, 5, 0.95);
            min-height: 52px;
            box-sizing: border-box;
            user-select: none;
            z-index: 90;
        }

        .tabs-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            min-width: 0;
        }

        .tabs-right {
            display: flex;
            align-items: center;
            flex: 0 0 auto;
            margin-left: 8px;
        }

        #tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            overflow-y: hidden;
            flex: 0 1 auto;
            max-width: calc(100% - 44px);
            min-width: 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        #tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            border: 1px solid var(--border-subtle);
            background: var(--bg-tab);
            color: var(--muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            transition: background 0.12s, border-color 0.12s, color 0.12s;
        }

        .tab::after {
            display: none;
        }

        .tab-icon {
            font-size: 13px;
            line-height: 1;
            opacity: 0.95;
        }

        .tab-label {
            line-height: 1;
        }

        .tab:hover {
            background: var(--bg-tab-hover);
            border-color: rgb(110, 110, 110);
        }

        .tab.active {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgb(110, 110, 110);
            color: #fff;
        }

        .tab.active::after {
            display: none;
        }

        #add-tab,
        #open-script-hub {
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            color: var(--muted);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            cursor: pointer;
            transition: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        #add-tab:hover,
        #open-script-hub:hover {
            border-color: rgb(110, 110, 110);
            color: #ffffff;
            background: rgba(255, 255, 255, 0.06);
        }

        #open-script-hub {
            width: auto;
            min-width: 36px;
            padding: 0 8px;
            gap: 6px;
            font-size: 12px;
        }

        #open-script-hub .script-hub-label {
            max-width: 0;
            opacity: 0;
            overflow: hidden;
            white-space: nowrap;
            transition: max-width 0.08s, opacity 0.14s ease;
        }

        #open-script-hub:hover .script-hub-label,
        #open-script-hub:focus-visible .script-hub-label,
        #open-script-hub:active .script-hub-label,
        #open-script-hub.open .script-hub-label {
            max-width: 72px;
            opacity: 1;
        }

        .editor-shell {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #000;
        }

        .editor-main-area {
            flex: 1 1 0;
            display: flex;
            overflow: hidden;
            min-height: 0;
            position: relative;
        }

        #monaco-editor {
            flex: 1;
            min-height: 0;
            border: none;
            overflow: hidden;
            contain: strict;
        }

        .script-hub-panel {
            flex: 0 0 0;
            width: 0;
            overflow: hidden;
            background: rgba(6, 6, 6, 0.97);
            border-left: 1px solid var(--border-subtle);
            position: relative;
            display: flex;
            flex-direction: column;
            z-index: 50;
            transition: width 0.0s;
            min-height: 0;
        }

        .script-hub-resizer {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 8px;
            cursor: ew-resize;
            background: linear-gradient(90deg, rgba(110, 110, 110, 0.35), transparent);
            z-index: 5;
        }

        .script-hub-panel.open {
            display: flex;
        }

        .script-hub-top {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-subtle);
            background: transparent;
        }

        #script-hub-search {
            flex: 1;
            min-width: 120px;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            height: 32px;
            padding: 0 12px;
            font-family: var(--font-ui);
            outline: none;
            transition: none;
        }

        #script-hub-search:focus {
            border-color: rgb(110, 110, 110);
        }

        .script-hub-btn {
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            border-radius: 8px;
            height: 32px;
            padding: 0 12px;
            cursor: pointer;
            font-family: var(--font-ui);
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: none;
        }

        .script-hub-btn:hover {
            border-color: rgb(110, 110, 110);
            background: rgba(255, 255, 255, 0.06);
        }

        #script-hub-load {
            border-color: rgb(110, 110, 110);
            color: #ffffff;
        }

        .script-hub-btn.tertiary {
            background: rgba(255, 255, 255, 0.03);
            border-color: #222;
            color: #888;
        }

        .script-hub-btn.tertiary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgb(110, 110, 110);
            color: #ffffff;
        }

        .script-hub-status {
            padding: 10px 16px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #ffffff;
            border-bottom: 1px solid var(--border-subtle);
            background: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .script-hub-status::before {
            content: '';
            width: 4px;
            height: 4px;
            background: #ffffff;
            border-radius: 50%;
        }

        .script-hub-list {
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .script-hub-list::-webkit-scrollbar {
            display: none;
        }

        .script-hub-cards {
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 8px;
        }

        .script-hub-more-row {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 10px;
        }

        .script-card {
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            background: rgba(255,255,255,0.04);
            -webkit-
            overflow: hidden;
            display: flex;
            flex-direction: column;
            width: 250px;
            transition: border-color 0.08s, box-shadow 0.18s ease;
        }

        .script-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            font-size: 10px;
            overflow: hidden;
            max-width: 100%;
        }

        .script-card:hover {
            border-color: rgb(110, 110, 110);
        }

        .script-cover-wrap {
            position: relative;
            width: 100%;
            height: 140px;
            overflow: hidden;
            background: #000;
        }

        .script-cover {
            height: 100%;
            width: 100%;
            object-fit: cover;
        }

        .script-title {
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.4;
            letter-spacing: 0.01em;
        }

        .tag {
            border-radius: 4px;
            padding: 2px 7px;
            border: 1px solid var(--border);
            background: #151515;
            color: var(--text);
            font-size: 10px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            flex-shrink: 0;
        }

        .tag i {
            font-size: 12px;
            color: #ffffff;
        }

        .tag.paid {
            border-color: #ff4444;
            color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
        }

        .tag.key {
            border-color: rgb(110, 110, 110);
            color: #ffffff;
            background: rgba(255, 255, 255, 0.06);
        }

        .script-actions {
            margin-top: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            overflow: visible;
            padding-top: 4px;
            opacity: 1;
            transform: none;
            pointer-events: auto;
        }

        .script-actions .script-action-btn:last-child {
            grid-column: 1 / -1;
        }

        .script-action-btn {
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            border-radius: 8px;
            height: 32px;
            padding: 0 6px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            font-family: var(--font-ui);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex: 0 0 auto;
            width: 100%;
            transition: none;
            white-space: nowrap;
        }

        .script-action-btn:hover {
            border-color: var(--muted);
            background: rgba(255, 255, 255, 0.08);
        }

        .script-action-btn:active {
            background: rgba(255, 255, 255, 0.12);
        }

        .script-action-btn.execute {
            border-color: rgb(110, 110, 110);
            color: #ffffff;
            background: rgba(255, 255, 255, 0.04);
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .script-action-btn.execute:hover {
            background: rgba(255, 255, 255, 0.10);
        }

        #script-hub-more {
            border-color: rgb(110, 110, 110);
            color: #ffffff;
        }

        @media (max-width: 900px) {
            .script-hub-panel {
                right: 0;
                width: min(100vw, 430px);
            }
        }


        .context-menu {
            position: fixed;
            z-index: 1000;
            min-width: 140px;
            background: rgba(10, 10, 10, 0.85);
            -webkit-
            border: 1px solid rgb(100, 100, 100);
            border-radius: 10px;
            display: none;
            padding: 6px;
        }



        .menu-item {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text);
            text-align: left;
            padding: 8px 10px;
            cursor: pointer;
            border-radius: 6px;
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
        }

        .menu-item:active {
            background: rgba(255, 255, 255, 0.12);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1100;
        }

        .modal-wrap {
            background: rgba(8, 8, 8, 0.88);
            -webkit-
            border: 1px solid rgb(100, 100, 100);
            border-radius: 14px;
            padding: 24px;
            width: 320px;
            box-sizing: border-box;
        }

        .modal-title {
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
        }

        .modal-input {
            width: 100%;
            box-sizing: border-box;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.08s;
            font-family: var(--font-ui);
        }

        .modal-input:focus {
            border-color: rgb(110, 110, 110);
        }

        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .modal-btn {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            padding: 10px 18px;
            min-width: 98px;
            justify-content: center;
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .modal-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--muted);
        }

        .modal-btn:active {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn-icon {
            display: inline-block;
            width: 14px;
            text-align: center;
            line-height: 1;
            opacity: 0.95;
        }

        .btn-icon[class*="vr-"],
        .tab-icon[class*="vr-"] {
            width: auto;
            font-size: 14px;
        }

        .modal-btn.primary {
            border-color: rgb(110, 110, 110);
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
        }

        .modal-btn.primary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgb(130, 130, 130);
        }

        .toast-wrap {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 1200;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: min(320px, calc(100vw - 24px));
            pointer-events: none;
        }

        .toast {
            border: 1px solid rgb(100, 100, 100);
            border-left: 3px solid rgb(110, 110, 110);
            background: rgba(8, 8, 8, 0.9);
            -webkit-
            color: #fff;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 500;
        }

        /* ── Bottom Output Panel ── */
        .output-panel {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            height: 180px;
            min-height: 60px;
            max-height: 60vh;
            border-top: 1px solid rgb(110, 110, 110);
            background: rgba(4, 4, 4, 0.97);
            position: relative;
            user-select: none;
        }

        /* Invisible overlay blocks pointer events into editor-main-area during resize
           — prevents the Monaco iframe from eating mousemove events */
        .resize-drag-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            cursor: ns-resize;
        }

        .resize-drag-overlay.active {
            display: block;
        }

        .output-panel-resizer {
            position: absolute;
            top: -5px;
            left: 0;
            right: 0;
            height: 10px;
            cursor: ns-resize;
            z-index: 10;
            /* Visual feedback stripe */
            background: transparent;

        let currentHostWindowState = 'Normal';

        function normalizeHostWindowState(windowState) {
            const normalized = typeof windowState === 'string' ? windowState.trim().toLowerCase() : '';
            if (normalized === 'maximized' || normalized === 'fullscreen') {
                return 'Maximized';
            }
            if (normalized === 'minimized') {
                return 'Minimized';

            return 'Normal';

        function isHostWindowMaximized(windowState = currentHostWindowState) {
            return normalizeHostWindowState(windowState) === 'Maximized';
        }

        function updateWindowResizeHandlesState(windowState = currentHostWindowState) {
            if (!appRoot) {

            const isMaximized = isHostWindowMaximized(windowState);
            appRoot.classList.toggle('host-maximized', isMaximized);
            if (maxWindowButton) {

            return value.replace(INVISIBLE_CHAR_PATTERN, '');

            // For huge strings, sample first/last 4KB for invisible chars

        function normalizeTabHistory(tab) {
            if (!Array.isArray(tab.history)) {
                tab.history = [typeof tab.content === 'string' ? tab.content : ''];

            tab.history = tab.history.filter(entry => typeof entry === 'string');
            if (tab.history.length === 0) {
                tab.history = [typeof tab.content === 'string' ? tab.content : ''];

            if (!Number.isInteger(tab.historyIndex)) {
                tab.historyIndex = tab.history.length - 1;

            tab.history.push(value);

        function setEditorValueSilently(value, selectChange = false) {
            if (!editor) {
                return;
            }

            const cleanValue = sanitizeScriptText(value);
            const model = editor.getModel();

            if (!model) {
                return;
            }

            const oldValue = model.getValue();

            if (oldValue === cleanValue) {
                return;
            }

            isApplyingHistory = true;

            // executeEdits replaces content without resetting the model — no full
            // re-tokenize pass, no undo-stack wipe, no viewport reset.
            // This is the fast path for switching tabs or loading a new script.
            const fullRange = model.getFullModelRange();
            model.pushEditOperations(
                [],
                [{ range: fullRange, text: cleanValue }],
                () => null
            );
            // Collapse cursor to top so viewport doesn't jump around
            editor.setPosition({ lineNumber: 1, column: 1 });
            editor.setScrollPosition({ scrollTop: 0 });

            isApplyingHistory = false;

            if (selectChange) {
                // Find changed region and select it
                let prefixLen = 0;
                let suffixLen = 0;
                while (prefixLen < oldValue.length && prefixLen < cleanValue.length && oldValue[prefixLen] === cleanValue[prefixLen]) {
                    prefixLen++;
                }
                while (suffixLen < oldValue.length - prefixLen && suffixLen < cleanValue.length - prefixLen &&
                    oldValue[oldValue.length - 1 - suffixLen] === cleanValue[cleanValue.length - 1 - suffixLen]) {
                    suffixLen++;
                }
                const startPos = model.getPositionAt(prefixLen);
                const endPos = model.getPositionAt(cleanValue.length - suffixLen);
                const range = new monaco.Range(startPos.lineNumber, startPos.column, endPos.lineNumber, endPos.column);

            }

            if (Object.keys(payload).length > 0) {
                return false;

        function handleHostMessage(raw) {

                return;
            }

            if (!data) return;

            // Version list update from C#
            if (data.type === 'versionList') {
                updateVersionList(data.versions || [], data.active || '');
                return;
            }

            // Roblox Output: new log line from Console.pid
            if (data.type === 'robloxLog') {
                const levelMap = { warn: 'warn', error: 'error', info: 'info', print: '' };
                const cls = levelMap[data.level] || '';
                appendOutputLine(data.line || '', cls);
                return;
            }

            // Roblox Output: client lost, wipe the panel
            if (data.type === 'clearRobloxOutput') {
                const pane = document.getElementById('output-pane-roblox-output');
                if (pane) {
                    pane.innerHTML = '<div class="output-empty">No output yet - execute a script to see results here.</div>';
                }
                return;

                return;

            const status = incomingStatus === 'Attached' || incomingStatus === 'Attaching' || incomingStatus === 'Error'

        function extractSearchTokens(value, output) {
            if (value === null || value === undefined) {
                return;
            }
            if (Array.isArray(value)) {
                value.forEach((entry) => extractSearchTokens(entry, output));
                return;
            }
            const valueType = typeof value;
            if (valueType === 'string' || valueType === 'number' || valueType === 'boolean') {
                const token = String(value).trim();
                if (token) {
                    output.push(token);
                }
                return;
            }
            if (valueType === 'object') {
                Object.values(value).forEach((entry) => extractSearchTokens(entry, output));
            }

        function normalizeSearchTokens(value) {
            const output = [];
            extractSearchTokens(value, output);
            return output.join(' ');

        function collectTagStrings(value, output) {
            if (value === null || value === undefined) {
                return;
            }
            if (Array.isArray(value)) {
                value.forEach((entry) => collectTagStrings(entry, output));
                return;
            }
            const valueType = typeof value;
            if (valueType === 'string') {
                const raw = value.trim();
                if (!raw) {
                    return;
                }
                raw.split(/[,|/]/).forEach((part) => {
                    const cleaned = part.trim();
                    if (cleaned) {
                        output.push(cleaned);
                    }
                });
                return;
            }
            if (valueType === 'number' || valueType === 'boolean') {
                output.push(String(value));
                return;
            }
            if (valueType === 'object') {
                const preferred = ['name', 'title', 'tag', 'label', 'text', 'value'];
                for (const key of preferred) {
                    if (key in value) {
                        collectTagStrings(value[key], output);
                    }
                }
                Object.values(value).forEach((entry) => collectTagStrings(entry, output));
            }

        function buildTagList(parts, limit = 6) {
            const raw = [];
            parts.forEach((part) => collectTagStrings(part, raw));
            const unique = [];
            const seen = new Set();
            raw.forEach((tag) => {
                const normalized = String(tag || '').trim();
                if (!normalized) {
                    return;
                }
                const key = normalized.toLowerCase();
                if (seen.has(key)) {
                    return;
                }
                seen.add(key);
                unique.push(normalized);

            return unique.slice(0, limit);

        function matchesScriptSearch(item, query) {

            if (terms.length === 0) {
                return true;
            }
            const gameText = String(item.searchGameText || '').toLowerCase();
            const mainText = String(item.searchTitleTagsText || '').toLowerCase();
            return terms.every((term) => gameText.includes(term) || mainText.includes(term));

        function normalizeApiQuery(value) {

        function normalizeWebUrl(url, source) {
            if (!url || typeof url !== 'string') {

                for (let i = 0; i < value.length; i += 1) {
                    const candidate = extractUrlCandidate(value[i], source);
                    if (candidate) {
                        return candidate;
                    }
                }
                return '';
            }
            if (typeof value === 'object') {
                const keys = ['url', 'href', 'link', 'keyUrl', 'keyURL', 'keyLink', 'bypass', 'destination'];
                for (let i = 0; i < keys.length; i += 1) {

        function formatCreatedAgo(timestamp) {

            const minute = 60 * 1000;
            const hour = 60 * minute;
            const day = 24 * hour;
            const month = 30 * day;

            if (diffMs < hour) {
                const minutes = Math.max(1, Math.floor(diffMs / minute));
                return `created ${minutes} min ago`;
            }
            if (diffMs < day) {
                const hours = Math.max(1, Math.floor(diffMs / hour));
                return `created ${hours}h ago`;
            }
            if (diffMs < month) {
                const days = Math.max(1, Math.floor(diffMs / day));
                return `created ${days}d ago`;

        function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));

        async function fetchJsonWithRetry(url, retries = 8) {
            let attempt = 0;
            while (true) {
                const response = await fetch(url);
                if (response.ok) {
                    const text = await response.text();
                    try {
                        return JSON.parse(text);
                    } catch (err) {
                        throw new Error('Invalid JSON response');
                    }
                }

                if (response.status === 429 && attempt < retries) {
                    const retryAfterRaw = response.headers.get('Retry-After');
                    const retryAfterSec = Number(retryAfterRaw);
                    const retryWaitMs = Number.isFinite(retryAfterSec) && retryAfterSec > 0
                        ? retryAfterSec * 1000
                        : (1600 * (attempt + 1)) + Math.floor(Math.random() * 500);
                    await sleep(retryWaitMs);
                    attempt += 1;
                    continue;
                }

                throw new Error(`Request failed (${response.status})`);
            }
        }

        async function fetchJsonWithCorsFallback(url) {
            const endpoints = [
                url,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                `https://corsproxy.io/?${encodeURIComponent(url)}`
            ];

            let lastError = null;
            for (const endpoint of endpoints) {
                try {
                    return await fetchJsonWithRetry(endpoint, endpoint === url ? 8 : 3);
                } catch (err) {
                    lastError = err;
                }
            }

            throw lastError || new Error('Failed to fetch JSON');
        }

        async function fetchScriptBloxPage(query, page) {
            const normalizedQuery = normalizeApiQuery(query);
            const endpoint = normalizedQuery
                ? `https://scriptblox.com/api/script/search?q=${encodeURIComponent(normalizedQuery)}&max=20&page=${page}`
                : `https://scriptblox.com/api/script/fetch?page=${page}`;
            const payload = await fetchJsonWithCorsFallback(endpoint);

            const result = payload && payload.result ? payload.result : {};
            const scripts = Array.isArray(result.scripts) ? result.scripts : [];
            const currentPage = Number.isInteger(result.currentPage) ? result.currentPage : page;
            const computedNextPage = Number.isInteger(result.totalPages) && currentPage < result.totalPages
                ? currentPage + 1
                : null;

            return {
                items: scripts.map(mapScriptBloxScript),
                nextPage: result.nextPage || computedNextPage
            };
        }

        async function fetchRscriptsPage(query, page) {
            const normalizedQuery = normalizeApiQuery(query);
            const endpoint = normalizedQuery
                ? `https://rscripts.net/api/v2/scripts?page=${page}&orderBy=date&sort=desc&q=${encodeURIComponent(normalizedQuery)}`
                : `https://rscripts.net/api/v2/scripts?page=${page}&orderBy=date&sort=desc`;
            const payload = await fetchJsonWithCorsFallback(endpoint);
            const scripts = Array.isArray(payload.scripts) ? payload.scripts : [];
            const maxPages = payload.info && Number.isInteger(payload.info.maxPages) ? payload.info.maxPages : page;
            return {
                items: scripts.map(mapRscriptsScript),
                nextPage: page < maxPages ? page + 1 : null
            };

        function appendScriptHubItems(items) {

            let added = 0;

        function setScriptHubWidth(width, persist = true) {
            const min = getScriptHubMinWidth();

            if (persist) {
                localStorage.setItem(SCRIPT_HUB_WIDTH_KEY, String(safe));

        function initializeScriptHubWidth() {
            const defaultWidth = getScriptHubDefaultWidth();
            const ratioRaw = Number(localStorage.getItem(SCRIPT_HUB_WIDTH_RATIO_KEY));
            if (Number.isFinite(ratioRaw) && ratioRaw > 0) {
                const fromRatio = window.innerWidth * ratioRaw;
                setScriptHubWidth(Math.max(defaultWidth, fromRatio), false);
                return;
            }

            const raw = localStorage.getItem(SCRIPT_HUB_WIDTH_KEY);
            const parsed = Number(raw);
            if (Number.isFinite(parsed) && parsed > 0) {
                setScriptHubWidth(Math.max(defaultWidth, parsed), false);
                return;
            }

            setScriptHubWidth(defaultWidth, false);
        }

        // ── IndexedDB helpers for large-content persistence ──────────────
        function _openIDB() {
            return new Promise((resolve, reject) => {
                if (_idb) { resolve(_idb); return; }
                try {
                    const req = indexedDB.open(IDB_DB_NAME, 1);
                    req.onupgradeneeded = () => {
                        const db = req.result;
                        if (!db.objectStoreNames.contains(IDB_STORE_NAME)) {
                            db.createObjectStore(IDB_STORE_NAME);
                        }
                    };
                    req.onsuccess = () => { _idb = req.result; _idbReady = true; resolve(_idb); };
                    req.onerror = () => { _idbFailed = true; reject(req.error); };
                } catch (e) { _idbFailed = true; reject(e); }
            });
        }

        function _idbPut(key, value) {
            return new Promise((resolve, reject) => {
                try {
                    const tx = _idb.transaction(IDB_STORE_NAME, 'readwrite');
                    tx.objectStore(IDB_STORE_NAME).put(value, key);
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                } catch (e) { reject(e); }
            });
        }

        function _idbGet(key) {
            return new Promise((resolve, reject) => {
                try {
                    const tx = _idb.transaction(IDB_STORE_NAME, 'readonly');
                    const req = tx.objectStore(IDB_STORE_NAME).get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                } catch (e) { reject(e); }
            });
        }

        // ── Prepare save payload without blocking main thread ─────────────
        function _buildSavePayload() {
            // Sync active editor content to tab object
            if (activeTabId && editor) {
                const activeTab = tabs.find(tab => tab.id === activeTabId);
                if (activeTab) {
                    activeTab.content = sanitizeScriptTextLazy(editor.getValue());
                }
            }
            // Build minimal payload — strip history for huge tabs to cut serialization cost
            const saveTabs = tabs.map(t => {
                const isLarge = t.content && t.content.length > LARGE_CONTENT_THRESHOLD;
                return {
                    id: t.id,
                    name: t.name,
                    content: t.content || '',
                    history: isLarge
                        ? t.history.slice(-MAX_HISTORY_ENTRIES_LARGE)
                        : t.history,
                    historyIndex: isLarge
                        ? Math.min(t.historyIndex, MAX_HISTORY_ENTRIES_LARGE - 1)
                        : t.historyIndex,
                    autoExec: t.autoExec || false
                };
            });
            return { tabs: saveTabs, activeTabId };
        }

        // ── Async save — never blocks UI ──────────────────────────────────
        async function saveStateAsync() {
            if (_saveInProgress) {
                _savePendingAfterCurrent = true;
                return;
            }
            _saveInProgress = true;
            try {
                const payload = _buildSavePayload();
                const json = JSON.stringify(payload);

                // Dedup: skip write if identical to last save
                if (json === _lastSavedJSON) {
                    _saveInProgress = false;
                    return;
                }

                // Try IndexedDB first (no size limit), fallback to localStorage
                if (_idbReady && !_idbFailed) {
                    try {
                        await _idbPut(IDB_KEY, payload);
                        _lastSavedJSON = json;
                        // Also keep a small metadata marker in localStorage for quick detect
                        try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ _idb: true, activeTabId: payload.activeTabId, tabCount: payload.tabs.length })); } catch(_e) {}
                    } catch (idbErr) {
                        console.warn('IDB save failed, falling back to localStorage:', idbErr);
                        _saveToLocalStorage(json);
                    }
                } else {
                    _saveToLocalStorage(json);
                }
            } catch (err) {
                console.error('Failed to save state:', err);
            } finally {
                _saveInProgress = false;
                if (_savePendingAfterCurrent) {
                    _savePendingAfterCurrent = false;
                    // Yield to browser before next save
                    setTimeout(saveStateAsync, 50);
                }
            }
        }

        function _saveToLocalStorage(json) {
            try {
                localStorage.setItem(STORAGE_KEY, json);
                _lastSavedJSON = json;
            } catch (e) {
                // localStorage quota exceeded — try trimming history
                console.warn('localStorage quota exceeded, trimming history...');
                tabs.forEach(t => {
                    if (t.history && t.history.length > 2) {
                        t.history = [t.history[t.history.length - 1]];
                        t.historyIndex = 0;
                    }
                });
                try {
                    const trimmed = JSON.stringify({ tabs, activeTabId });
                    localStorage.setItem(STORAGE_KEY, trimmed);
                    _lastSavedJSON = trimmed;
                } catch (e2) {
                    console.error('Save failed even after trimming:', e2);
                }
            }
        }

        // Synchronous save — kept for beforeunload/pagehide where async may not complete
        function saveState() {
            try {
                const payload = _buildSavePayload();
                const json = JSON.stringify(payload);
                if (json === _lastSavedJSON) return;
                _saveToLocalStorage(json);
                // Fire-and-forget IDB save too
                if (_idbReady && !_idbFailed) {
                    try { _idbPut(IDB_KEY, payload); } catch(_e) {}
                }
            } catch (err) {
                console.error('Failed to save state:', err);
            }
        }

        // ── Load state — try IDB first, then localStorage ────────────────
        async function loadStateAsync() {
            try {
                await _openIDB();
            } catch (e) {
                console.warn('IndexedDB unavailable, using localStorage only:', e);
            }

            // Try IndexedDB first
            if (_idbReady) {
                try {
                    const data = await _idbGet(IDB_KEY);
                    if (data && Array.isArray(data.tabs)) {
                        return _applyLoadedState(data);
                    }
                } catch (e) {
                    console.warn('IDB load failed:', e);
                }
            }

            // Fallback: localStorage
            return loadState();
        }

        function _applyLoadedState(parsed) {
            if (!parsed || !Array.isArray(parsed.tabs)) return false;
            if (parsed._idb) return false; // This is just a marker, not real data

            if (parsed.tabs.length === 0) {
                tabs = [];
                activeTabId = null;
                return true;
            }

            const seen = new Set();
            const loadedTabs = [];

            for (const item of parsed.tabs) {
                if (!item || typeof item.name !== 'string') continue;
                const cleanedName = sanitizeName(item.name);
                if (!cleanedName) continue;
                const key = cleanedName.toLowerCase();
                if (seen.has(key)) continue;
                seen.add(key);

                // Lazy sanitize — skip heavy regex on huge content during load
                const content = sanitizeScriptTextLazy(typeof item.content === 'string' ? item.content : '');
                const history = Array.isArray(item.history)
                    ? item.history.filter(entry => typeof entry === 'string')
                    : [content];
                const safeHistory = history.length > 0 ? history : [content];
                const rawIndex = Number.isInteger(item.historyIndex) ? item.historyIndex : safeHistory.length - 1;
                const historyIndex = Math.max(0, Math.min(rawIndex, safeHistory.length - 1));

                loadedTabs.push({
                    id: typeof item.id === 'string' ? item.id : generateId(),
                    name: cleanedName,
                    content: safeHistory[historyIndex],
                    history: safeHistory,
                    historyIndex,
                    autoExec: Boolean(item.autoExec)
                });
            }

            tabs = loadedTabs;
            const exists = tabs.some(tab => tab.id === parsed.activeTabId);
            activeTabId = (exists && tabs.length > 0) ? parsed.activeTabId : (tabs.length > 0 ? tabs[0].id : null);
            return true;
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) {
                    return false;
                }

                const parsed = JSON.parse(raw);

                // If localStorage just has IDB marker, no real data here
                if (parsed && parsed._idb) {
                    return false;
                }

                return _applyLoadedState(parsed);
            } catch (err) {
                console.error('Failed to load state:', err);
                return false;
            }
        }

        function createDefaultState() {
            // Default: no tabs open
            tabs = [];
            activeTabId = null;
        }

        function getNextScriptName() {
            let index = 1;
            while (tabNameExists(`script${index}`)) {
                index += 1;
            }
            return `script${index}`;
        }

        // ── Tab drag-and-drop state ──
        let dragTabId = null;
        let dragTabEl = null;
        let dragTabStartX = 0;
        let dragTabActive = false;
        const DRAG_TAB_THRESHOLD = 5;

        function renderTabs() {
            tabsContainer.innerHTML = '';

            tabs.forEach(tab => {
                const tabBtn = document.createElement('button');
                tabBtn.type = 'button';
                tabBtn.className = `tab${tab.id === activeTabId ? ' active' : ''}`;
                tabBtn.innerHTML = `<i class="tab-icon fas fa-file-code"></i><span class="tab-label"></span>`;
                tabBtn.querySelector('.tab-label').textContent = tab.name;
                tabBtn.dataset.tabId = tab.id;

                tabBtn.addEventListener('click', () => {
                    if (dragTabActive) return;
                    switchTab(tab.id);
                });

                // ── Drag to reorder ──
                tabBtn.addEventListener('mousedown', (e) => {
                    if (e.button !== 0) return;
                    dragTabId = tab.id;
                    dragTabEl = tabBtn;
                    dragTabStartX = e.clientX;
                    dragTabActive = false;

                    const onMove = (mv) => {
                        if (!dragTabActive) {
                            if (Math.abs(mv.clientX - dragTabStartX) < DRAG_TAB_THRESHOLD) return;
                            dragTabActive = true;
                            dragTabEl.classList.add('tab-dragging');
                        }
                        // Find which tab slot the cursor is over
                        const allTabEls = Array.from(tabsContainer.querySelectorAll('.tab'));
                        let targetEl = null;
                        let insertBefore = false;
                        for (const el of allTabEls) {
                            if (el === dragTabEl) continue;
                            const rect = el.getBoundingClientRect();
                            const mid = rect.left + rect.width / 2;
                            if (mv.clientX < mid) {
                                targetEl = el;
                                insertBefore = true;
                                break;
                            } else if (mv.clientX >= rect.left && mv.clientX <= rect.right) {
                                targetEl = el;
                                insertBefore = false;
                            }
                        }
                        // Visual ghost reorder
                        allTabEls.forEach(el => el.classList.remove('tab-drop-left', 'tab-drop-right'));
                        if (targetEl) {
                            targetEl.classList.add(insertBefore ? 'tab-drop-left' : 'tab-drop-right');
                        }
                    };

                    const onUp = (up) => {
                        document.removeEventListener('mousemove', onMove, true);
                        document.removeEventListener('mouseup', onUp, true);

                        const wasDragging = dragTabActive;

                        if (wasDragging && dragTabId) {
                            // Commit reorder
                            const allTabEls = Array.from(tabsContainer.querySelectorAll('.tab'));
                            let targetId = null;
                            let insertBefore = false;
                            for (const el of allTabEls) {
                                if (el === dragTabEl) continue;
                                const rect = el.getBoundingClientRect();
                                const mid = rect.left + rect.width / 2;
                                if (up.clientX < mid) {
                                    targetId = el.dataset.tabId;
                                    insertBefore = true;
                                    break;
                                } else if (up.clientX >= rect.left && up.clientX <= rect.right) {
                                    targetId = el.dataset.tabId;
                                    insertBefore = false;
                                }
                            }
                            if (targetId && targetId !== dragTabId) {
                                const fromIdx = tabs.findIndex(t => t.id === dragTabId);
                                let toIdx = tabs.findIndex(t => t.id === targetId);
                                if (!insertBefore) toIdx += 1;
                                if (fromIdx !== -1 && toIdx !== -1) {
                                    const [moved] = tabs.splice(fromIdx, 1);
                                    const insertAt = toIdx > fromIdx ? toIdx - 1 : toIdx;
                                    tabs.splice(insertAt, 0, moved);
                                    scheduleSave();
                                }
                            }
                            // Only re-render after a real drag — for plain clicks
                            // the click event fires next and switchTab() renders.
                            renderTabs();
                        }

                        dragTabId = null;
                        dragTabEl = null;
                        dragTabActive = false;
                    };

                    document.addEventListener('mousemove', onMove, true);
                    document.addEventListener('mouseup', onUp, true);
                });

                tabsContainer.appendChild(tabBtn);
            });

            // Show/hide no-tab overlay
            if (noTabOverlay) {
                noTabOverlay.classList.toggle('visible', tabs.length === 0);
            }
        }

        function switchTab(tabId) {
            if (!editor || tabId === activeTabId) {
                return;
            }

            clearTimeout(historyCheckpointTimer);
            if (activeTabId) {
                commitActiveHistoryCheckpoint();
            }

            activeTabId = tabId;
            const nextTab = tabs.find(tab => tab.id === tabId);
            setEditorValueSilently(nextTab ? nextTab.content : '');
            renderTabs();
            scheduleSave();
        }

        function createTabWithName(name) {
            if (editor) {
                clearTimeout(historyCheckpointTimer);
                commitActiveHistoryCheckpoint();
            }

            const defaultContent = 'print("NOTHING X")';
            const newTab = {
                id: generateId(),
                name,
                content: defaultContent,
                history: [defaultContent],
                historyIndex: 0
            };

            tabs.push(newTab);
            activeTabId = newTab.id;

            if (editor) {
                setEditorValueSilently(defaultContent);
            }

            renderTabs();
            scheduleSave();
        }

        function openTabModal(mode, tabId = null) {
            modalMode = mode;
            modalTabId = tabId;

            if (mode === 'rename') {
                const tab = tabs.find(t => t.id === tabId);
                if (!tab) {
                    return;
                }
                modalTitle.textContent = 'Rename Tab';
                modalSubmitButton.innerHTML = '<i class="btn-icon fas fa-pencil"></i><span>Rename</span>';
                modalInput.value = tab.name;
            } else {
                modalTitle.textContent = 'New Tab';
                modalSubmitButton.innerHTML = '<i class="btn-icon fas fa-plus"></i><span>Create</span>';
                modalInput.value = getNextScriptName();
            }

            modalOverlay.style.display = 'flex';
            setTimeout(() => {
                modalInput.focus();
                modalInput.select();
            }, 0);
        }

        function closeTabModal() {
            modalOverlay.style.display = 'none';
            modalMode = null;
            modalTabId = null;
        }

        function submitTabModal() {
            const name = sanitizeName(modalInput.value);
            if (!name) {
                showToast('Tab name cannot be empty.');
                return;
            }
            if (name.length < 3) {
                showToast('Tab name must be at least 3 characters.');
                return;
            }

            if (modalMode === 'new') {
                if (tabNameExists(name)) {
                    showToast('Tab name already exists.');
                    return;
                }
                createTabWithName(name);
                closeTabModal();
                return;
            }

            if (modalMode !== 'rename') {
                return;
            }

            const tab = tabs.find(t => t.id === modalTabId);
            if (!tab) {
                closeTabModal();
                return;
            }

            if (name.toLowerCase() !== tab.name.toLowerCase() && tabNameExists(name, tab.id)) {
                showToast('Tab name already exists.');
                return;
            }

            if (name === tab.name) {
                closeTabModal();
                return;
            }

            tab.name = name;
            renderTabs();
            scheduleSave();
            closeTabModal();
        }

        function deleteTab(tabId) {
            const index = tabs.findIndex(tab => tab.id === tabId);
            if (index === -1) {
                return;
            }

            clearTimeout(historyCheckpointTimer);
            commitActiveHistoryCheckpoint();

            const deletingActive = tabs[index].id === activeTabId;
            tabs.splice(index, 1);

            if (deletingActive) {
                if (tabs.length > 0) {
                    const fallback = tabs[Math.max(0, index - 1)] || tabs[0];
                    activeTabId = fallback.id;
                    if (editor) {
                        setEditorValueSilently(fallback.content);
                    }
                } else {
                    activeTabId = null;
                    if (editor) {
                        setEditorValueSilently('');
                    }
                }
            }

            renderTabs();
            scheduleSave();
        }

        function showContextMenu(x, y, tabId) {
            contextTabId = tabId;
            // Sync auto-execute button state with this tab
            const tab = tabs.find(t => t.id === tabId);
            if (contextAutoExecuteBtn && tab) {
                contextAutoExecuteBtn.dataset.autoExec = tab.autoExec ? 'on' : 'off';
            }
            const isHidden = contextMenu.style.display === 'none';
            contextMenu.style.display = 'block';

            if (isHidden) {
                contextMenu.style.transition = 'none';
                contextMenu.classList.remove('animating');
                void contextMenu.offsetWidth;
                contextMenu.classList.add('animating');
            } else {
                contextMenu.style.transition = '';
            }

            const maxX = window.innerWidth - contextMenu.offsetWidth - 8;
            const maxY = window.innerHeight - contextMenu.offsetHeight - 8;

            contextMenu.style.left = `${Math.max(8, Math.min(x, maxX))}px`;
            contextMenu.style.top = `${Math.max(8, Math.min(y, maxY))}px`;

            contextMenu.style.transition = '';
        }

        function hideContextMenu() {
            contextMenu.style.display = 'none';
            contextMenu.classList.remove('animating');
            contextTabId = null;
        }

        function showEditorContextMenu(x, y) {
