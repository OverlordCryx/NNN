        /* Tab switching */
        outputTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                outputTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const targetId = tab.dataset.outputTab;
                document.querySelectorAll('.output-pane').forEach(p => p.classList.remove('active'));
                const pane = document.getElementById('output-pane-' + targetId);
                if (pane) pane.classList.add('active');
                if (targetId === 'terminal') terminalBadge.style.display = 'none';
            });
        });

        /* Clear active pane */
        outputClearBtn.addEventListener('click', () => {
            const activePane = document.querySelector('.output-pane.active');
            if (!activePane) return;
            const id = activePane.id;
            if (id === 'output-pane-roblox-output') {
                activePane.innerHTML = '<div class="output-empty">No output yet — execute a script to see results here.</div>';
            } else if (id === 'output-pane-terminal') {
                activePane.innerHTML = '<div class="terminal-line"><span class="terminal-prompt">$</span><span class="terminal-text">Ready.</span></div>';
            }
        });

        /* Output panel vertical resize — drag overlay prevents Monaco from eating mouse events */
        let isResizingOutput = false;
        let outputResizeStartY = 0;
        let outputResizeStartH = 0;
        let outputResizeRaf = null;

        outputPanelResizer.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            e.preventDefault();
            e.stopPropagation();
            isResizingOutput = true;
            outputResizeStartY = e.clientY;
            outputResizeStartH = outputPanel.getBoundingClientRect().height;
            outputPanelResizer.classList.add('dragging');
            resizeDragOverlay.classList.add('active');
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizingOutput) return;
            if (outputResizeRaf) cancelAnimationFrame(outputResizeRaf);
            outputResizeRaf = requestAnimationFrame(() => {
                const delta = outputResizeStartY - e.clientY;
                const newH = Math.max(60, Math.min(window.innerHeight * 0.6, outputResizeStartH + delta));
                outputPanel.style.height = newH + 'px';
                if (editor) editor.layout();
            });
        });

        document.addEventListener('mouseup', () => {
            if (!isResizingOutput) return;
            isResizingOutput = false;
            outputPanelResizer.classList.remove('dragging');
            resizeDragOverlay.classList.remove('active');
            document.body.style.userSelect = '';
            if (outputResizeRaf) { cancelAnimationFrame(outputResizeRaf); outputResizeRaf = null; }
            if (editor) editor.layout();
            // Save console height
            const h = outputPanel.getBoundingClientRect().height;
            if (h >= 60) localStorage.setItem(CONSOLE_HEIGHT_KEY, String(Math.round(h)));
        });

        /* ── Console visibility + height persistence ── */
        function isConsoleVisible() {
            return outputPanel.style.display !== 'none';
        }

        function setConsoleVisible(visible, persist = true) {
            outputPanel.style.display = visible ? 'flex' : 'none';
            consoleToggleBtn.classList.toggle('console-visible', visible);
            if (persist) {
                localStorage.setItem(CONSOLE_VISIBLE_KEY, visible ? '1' : '0');
            }
            if (editor) editor.layout();
        }

        function toggleConsole() {
            setConsoleVisible(!isConsoleVisible());
        }

        function loadConsoleState() {
            const savedHeight = localStorage.getItem(CONSOLE_HEIGHT_KEY);
            if (savedHeight) {
                const h = Number(savedHeight);
                if (Number.isFinite(h) && h >= 60) {
                    outputPanel.style.height = `${h}px`;
                }
            }
            const savedVisible = localStorage.getItem(CONSOLE_VISIBLE_KEY);
            // Default is hidden (null = first launch = hidden too)
            setConsoleVisible(savedVisible === '1', false);
        }

        function appendOutputLine(text, type = '') {
            const pane = document.getElementById('output-pane-roblox-output');
            const empty = pane.querySelector('.output-empty');
            if (empty) empty.remove();
            const now = new Date();
            const ts = now.toLocaleTimeString('en-GB', { hour12: false });
            const line = document.createElement('div');
            line.className = 'output-line';
            line.innerHTML = `<span class="output-ts">${ts}</span><span class="output-msg ${type}">${text}</span>`;
            pane.appendChild(line);
            const content = pane.parentElement;
            content.scrollTop = content.scrollHeight;
        }

        window.logRbx = function(msg, type = 'info') {
            const pane = document.getElementById('output-pane-terminal');
            if (!pane) return;
            const empty = pane.querySelector('.output-empty');
            if (empty) empty.remove();
            
            const line = document.createElement('div');
            line.className = 'terminal-line';
            
            let color = '#dddddd';
            if (type === 'err' || type === 'error') color = '#ff5555';
            else if (type === 'warn') color = '#ffd400';
            else if (type === 'ok' || type === 'success') color = '#44ff88';
            else if (type === 'info') color = '#888888';

            line.innerHTML = `<span class="terminal-prompt" style="color:${color};">$</span><span class="terminal-text" style="color:${color};">${msg}</span>`;
            pane.appendChild(line);
            
            const content = pane.parentElement;
            if (content) content.scrollTop = content.scrollHeight;
        };

        document.addEventListener('click', (event) => {
            if (!contextMenu.contains(event.target)) {
                hideContextMenu();
            }
            if (!editorContextMenu.contains(event.target)) {
                hideEditorContextMenu();
            }
        });

        document.addEventListener('contextmenu', (event) => {
            event.preventDefault();
            const tabElement = event.target.closest('.tab');
            if (tabElement && tabElement.dataset.tabId) {
                hideEditorContextMenu();
                showContextMenu(event.clientX, event.clientY, tabElement.dataset.tabId);
                return;
            }

            if (event.target.closest('#monaco-editor')) {
                hideContextMenu();
                showEditorContextMenu(event.clientX, event.clientY);
                return;
            }

            hideContextMenu();
            hideEditorContextMenu();
        });

        document.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();
            const hasCommand = event.ctrlKey || event.metaKey;

            if (key === 'f5' || (hasCommand && key === 'r')) {
                event.preventDefault();
                return;
            }

            if (!editor) {
                return;
            }

            const target = event.target;
            const isInput = target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target.isContentEditable;
            const insideEditor = target instanceof Node && editorHost.contains(target);
            if (isInput && !insideEditor) {
                return;
            }

            if (!hasCommand) {
                return;
            }

            if (key === 'z' && event.shiftKey) {
                event.preventDefault();
                redoActiveTab();
                return;
            }

            if (key === 'z') {
                event.preventDefault();
                undoActiveTab();
                return;
            }

            if (key === 'y') {
                event.preventDefault();
                redoActiveTab();
            }
        });

        renameTabButton.addEventListener('click', () => {
            if (contextTabId) {
                openTabModal('rename', contextTabId);
            }
            hideContextMenu();
        });

        deleteTabButton.addEventListener('click', () => {
            if (contextTabId) {
                deleteTab(contextTabId);
            }
            hideContextMenu();
        });

        executeTabButton.addEventListener('click', () => {
            executeActiveTabScript();
            hideEditorContextMenu();
        });

        clearTabButton.addEventListener('click', () => {
            clearActiveTabContent();
            hideEditorContextMenu();
        });
        addTabButton.addEventListener('click', () => {
            hideContextMenu();
            hideEditorContextMenu();
            openTabModal('new');
        });

        openScriptHubButton.addEventListener('click', () => {
            hideContextMenu();
            hideEditorContextMenu();
            toggleScriptHub();
        });

        resizeHandles.forEach((handle) => {
            handle.addEventListener('mousedown', (event) => {
                if (event.button !== 0) {
                    return;
                }
                event.preventDefault();
                event.stopPropagation();
                
                const dir = handle.dataset.resizeDir;
                let isDragPending = true;
                const startX = event.clientX;
                const startY = event.clientY;
                
                const handleMove = (moveEvent) => {
                    if (!isDragPending) return;
                    const dx = Math.abs(moveEvent.clientX - startX);
                    const dy = Math.abs(moveEvent.clientY - startY);
                    if (dx + dy >= 2) {
                        isDragPending = false;
                        document.removeEventListener('mousemove', handleMove, true);
                        document.removeEventListener('mouseup', handleUp, true);
                        startHostResize(dir);
                    }
                };
                const handleUp = () => {
                    isDragPending = false;
                    document.removeEventListener('mousemove', handleMove, true);
                    document.removeEventListener('mouseup', handleUp, true);
                };
                document.addEventListener('mousemove', handleMove, true);
                document.addEventListener('mouseup', handleUp, true);
            });
        });


        scriptHubLoadButton.addEventListener('click', () => {
            loadAllScripts();
        });
        scriptHubMoreButton.addEventListener('click', () => {
            loadMoreScripts();
        });

        scriptHubSearch.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                loadAllScripts();
            }
        });

        scriptHubResizer.addEventListener('mousedown', (event) => {
            event.preventDefault();
            isResizingScriptHub = true;
            scriptHubResizeStartX = event.clientX;
            scriptHubResizeStartWidth = scriptHubPanel.getBoundingClientRect().width;
            document.body.style.cursor = 'ew-resize';
        });

        document.addEventListener('mousemove', (event) => {
            if (!isResizingScriptHub) {
                return;
            }

            const delta = scriptHubResizeStartX - event.clientX;
            setScriptHubWidth(scriptHubResizeStartWidth + delta);
        });

        document.addEventListener('mouseup', () => {
            if (!isResizingScriptHub) {
                return;
            }
            isResizingScriptHub = false;
            document.body.style.cursor = '';
        });

        window.addEventListener('resize', () => {
            const ratioRaw = Number(localStorage.getItem(SCRIPT_HUB_WIDTH_RATIO_KEY));
            if (Number.isFinite(ratioRaw) && ratioRaw > 0) {
                setScriptHubWidth(window.innerWidth * ratioRaw, false);
                return;
            }

            const width = scriptHubPanel.getBoundingClientRect().width || getScriptHubDefaultWidth();
            setScriptHubWidth(width, false);
        });

        tabsContainer.addEventListener('wheel', (event) => {
            const hasHorizontalDelta = Math.abs(event.deltaX) > 0;
            const delta = hasHorizontalDelta ? event.deltaX : event.deltaY;
            if (delta === 0) {
                return;
            }

            event.preventDefault();
            tabsContainer.scrollLeft += delta;
        }, { passive: false });

        modalSubmitButton.addEventListener('click', submitTabModal);
        modalCancelButton.addEventListener('click', closeTabModal);
        modalOverlay.addEventListener('click', (event) => {
            if (event.target === modalOverlay) {
                closeTabModal();
            }
        });
        modalInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                submitTabModal();
            }
            if (event.key === 'Escape') {
                closeTabModal();
            }
        });

        closeWindowButton.addEventListener('click', () => {
            saveAllTabsImmediately();
            sendHostCommand('close');
        });
        maxWindowButton.addEventListener('click', () => {
            sendHostCommand('maxToggle');
        });
        minWindowButton.addEventListener('click', () => {
            sendHostCommand('min');
        });

        // Console toggle button
        consoleToggleBtn.addEventListener('click', () => {
            toggleConsole();
        });

        // Reload API (reconnect) button
        reloadFullBtn.addEventListener('click', () => {
            sendHostCommand('reloadApi');
            showToast('Re-attaching...');
        });

        // Version selector button
        const versionSelectBtn = document.getElementById('version-select-btn');
        const versionPopup = document.getElementById('version-popup');

        let activeVersion = '';

        function updateVersionList(versions, active) {
            activeVersion = active;
            const list = document.getElementById('version-list-items');
            if (!list) return;

            // Update active label badge
            const badge = document.getElementById('active-ver-badge');
            if (badge) badge.textContent = active ? active.replace('X-', 'v') : 'none';

            list.innerHTML = '';
            if (!versions || versions.length === 0) {
                list.innerHTML = '<div style="padding:8px 12px;font-size:11px;color:rgba(255,255,255,0.4);">No versions downloaded yet</div>';
                return;
            }
            versions.forEach(v => {
                const item = document.createElement('div');
                item.className = 'ver-item' + (v === active ? ' ver-active' : '');
                item.innerHTML = `<i class="fas fa-microchip" style="font-size:10px;opacity:0.6;"></i><span>${v.replace('X-', 'v')}</span>${v === active ? '<i class="fas fa-check" style="font-size:9px;color:#28c840;"></i>' : ''}`;
                item.addEventListener('click', () => {
                    versionPopup.style.display = 'none';
                    sendHostCommand('selectVersion', { ver: v });
                    showToast('Loading ' + v.replace('X-', 'v') + '...');
                });
                list.appendChild(item);
            });
        }

        if (versionSelectBtn && versionPopup) {
            versionSelectBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const show = versionPopup.style.display !== 'block';
                versionPopup.style.display = show ? 'block' : 'none';
                if (show) sendHostCommand('requestVersionList');
            });
            document.addEventListener('click', (e) => {
                if (versionPopup.style.display === 'block' &&
                    !versionPopup.contains(e.target) &&
                    !versionSelectBtn.contains(e.target)) {
                    versionPopup.style.display = 'none';
                }
            });
        }

        // Auto-execute toggle in tab context menu
        contextAutoExecuteBtn.addEventListener('click', () => {
            if (!contextTabId) return;
            const tab = tabs.find(t => t.id === contextTabId);
            if (!tab) return;
            tab.autoExec = !tab.autoExec;
            contextAutoExecuteBtn.dataset.autoExec = tab.autoExec ? 'on' : 'off';
            scheduleSave();
        });

        // Block F5 / Ctrl+R / Ctrl+Shift+R at capture phase so nothing can refresh the page
        window.addEventListener('keydown', (e) => {
            const k = e.key;
            if (k === 'F5' || ((e.ctrlKey || e.metaKey) && (k === 'r' || k === 'R'))) {
                e.preventDefault();
                e.stopImmediatePropagation();
            }
        }, true);

        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', (event) => {
                handleHostMessage(event.data);
            });
        }

        async function startup() {
            // Try async IDB load first (handles huge scripts beyond localStorage limits)
            let loaded = false;
            try {
                loaded = await loadStateAsync();
            } catch (e) {
                console.warn('Async load failed, trying sync localStorage:', e);
                loaded = loadState();
            }
            if (!loaded) createDefaultState();
            loadConsoleState();
            toggleScriptHub(false);
            initializeScriptHubWidth();
            updateWindowResizeHandlesState();
            bindWindowBarDragBridge();
            setWindowAttachStatus('NotAttached');
            renderTabs();
            initializeMonacoEditor();
            sendHostCommand('status');
            if (window.chrome && window.chrome.webview) {
                clearTimeout(statusPollTimer);
                const pollStatus = () => {
                    sendHostCommand('status');
                    const delay = document.visibilityState === 'hidden'
                        ? STATUS_POLL_HIDDEN_MS
                        : (currentAttachStatus === 'Attached' ? STATUS_POLL_ACTIVE_MS : STATUS_POLL_IDLE_MS);
                    statusPollTimer = setTimeout(pollStatus, delay);
                };
                pollStatus();
            }
        }
        startup();
    </script>
</body>

</html>
